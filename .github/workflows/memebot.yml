name: MemeBot   # schedule refresh

on:
  schedule:
    # Each job runs ~5.5 hours by itself (memebot/loop.py) and queues its own successor as soon
    # as it starts (step "Queue the next run"), so the next job begins the moment this one ends.
    # The cron is only a backup in case that chain ever breaks (it alone left 2-4.6h gaps, Nov 2026).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:            # lets you press "Run workflow" by hand
    inputs:
      test:
        description: "Send a Telegram test message first"
        type: boolean
        default: true
      minutes:
        description: "How long this run should keep scanning (minutes, max 330)"
        default: "330"

permissions:
  contents: write               # needed to save state/seen.json between runs
  actions: write                # needed to queue the next run

concurrency:
  group: memebot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # start from the newest saved state, not the copy from when this run was queued
          fetch-depth: 0     # full history, so a damaged seen.json can be restored from an older version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Queue the next run (so there is no gap when this one ends)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The concurrency group below lets one run wait while this one works, so this queued run
          # starts as soon as this job finishes. If it fails, the cron above is the backup.
          gh workflow run memebot.yml --repo "${{ github.repository }}" --ref main -f test=false \
            || echo "Could not queue the next run; the schedule will start one instead"

      - name: Scan Solana + BSC and send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MEMEBOT_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
          MEMEBOT_LOOP_MINUTES: ${{ inputs.minutes || '330' }}
          PYTHONUNBUFFERED: "1"   # show progress in the live job log
        run: |
          git config user.name "memebot"
          git config user.email "memebot@users.noreply.github.com"
          python -m memebot.loop

      - name: Save memory of alerted coins
        if: always()
        run: |
          git config user.name "memebot"
          git config user.email "memebot@users.noreply.github.com"
          python -c "from memebot.loop import push_state; push_state()"
